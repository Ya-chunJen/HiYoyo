; HiYoyo 配置文件模板。复制本文件并重命名为 config.ini，填入你的密钥。

[LLM]
; ===== 大模型配置：任意 OpenAI 兼容服务均可接入 =====
; 常用厂商参考（base_url 与推荐模型）：
;   OpenAI    : https://api.openai.com/v1                              model = gpt-4o-mini
;   DeepSeek  : https://api.deepseek.com/v1                            model = deepseek-chat
;   通义千问  : https://dashscope.aliyuncs.com/compatible-mode/v1      model = qwen-plus
;   智谱GLM   : https://open.bigmodel.cn/api/paas/v4                   model = glm-4-flash
;   Moonshot  : https://api.moonshot.cn/v1                             model = moonshot-v1-8k
;   本地Ollama: http://localhost:11434/v1                              model = qwen2.5:7b （api_key 随便填，如 ollama）
base_url = https://api.deepseek.com/v1
api_key = sk-
model = deepseek-chat

; 可选：指定一个支持图片输入的模型，供 videovison（摄像头视觉）插件使用。
; 留空则使用上面的 model。
vision_model =

; 采样温度（0-2，越大越发散）
temperature = 0.7
; 每次请求最多携带的历史消息条数（不含 system），控制 token 消耗
max_history = 20

[AzureSpeech]
; ===== Azure 语音服务 =====
; ASR（语音转文字）必须配置 Azure key；TTS（文字转语音）没有 key 时会自动
; 降级到免费的 Edge-TTS。角色音色可加前缀强制指定：azure:xxx / edge:xxx
AZURE_API_KEY =
AZURE_REGION = eastasia

[Wakeword]
; ===== 唤醒词方案 =====
; OpenWakeWord：完全离线、免费、无需任何 key（推荐）。内置唤醒词：
;               hey_jarvis_v0.1（"hey jarvis"）/ alexa_v0.1 / hey_mycroft_v0.1
;               首次使用需联网下载模型（约 2MB，之后离线）
; Keyboard  ：键盘唤醒（按回车键唤醒，最简单的兜底方案）
WakeUpScheme = OpenWakeWord

; openWakeWord 使用的唤醒词模型名
OpenWakeWord_Model = hey_jarvis_v0.1
; openWakeWord 触发阈值（0-1，越低越灵敏也越容易误触发）
OpenWakeWord_Threshold = 0.5

; 输入设备名称（模糊匹配），留空用系统默认输入设备
Input_Device =

; 开机启动时播报的唤醒词文本
wakewordtext = HiYoyo

; 唤醒灵敏度（0-1，越高越容易被唤醒，也越容易误唤醒）
Sensitivity = 0.6

; 对话中说包含此停止词的话，智能音箱进入睡眠，等待唤醒词再次唤醒
StopWord = 退下吧

; ===== 以下为插件使用的配置段，不用对应插件可忽略 =====

[QQsmtp]
; sendemail 插件：QQ 邮箱 SMTP 配置（password 为授权码，不是登录密码）
sender =
password =

[aliyunoss]
; aliyunossup 插件：阿里云 OSS 配置
AccessKey =
AccessScret =
bucketname =
bucketdomain =
